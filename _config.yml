# Site settings
remote_theme: "academicpages/academicpages.github.io"
locale: "en-US"
title: "Junteng Liu"
name: "Junteng Liu"
description: "First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning."
url: "https://madwatse.github.io"
baseurl: "/LJT-Homepage"
repository: "madwatse/LJT-Homepage"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    disable: false

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

include:
  - _pages

exclude:
  - .git
  - .github
  - .devcontainer
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - markdown_generator

search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true

atom_feed:
  path: atom.xml
  hide: true

collections:
  publications:
    output: true

defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: single
      author_profile: true
      share: true
      related: true
      read_time: false

author:
  name: "Junteng Liu"
  email: "jliugi@connect.ust.hk"
  bio: "First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning."
  github: "Vicent0205"
  twitter: "junteng88716710"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:jliugi@connect.ust.hk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "X"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/junteng88716710"
